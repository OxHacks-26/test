<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sea turtle migrations · OxHack '26</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
  <div id="map" role="application" aria-label="World ocean map"></div>
  <div class="time-bar">
    <button type="button" id="turtle-play" aria-pressed="true">Pause</button>
    <label class="time-readout" for="turtle-time">
      <span id="turtle-month">January</span>
      <span>Illustrative routes — not observed tracking</span>
    </label>
    <input id="turtle-time" type="range" min="0" max="1000" step="1" value="0" aria-label="Time along the illustrative routes" aria-valuetext="January">
    <ol class="time-months" aria-hidden="true">
      <li>Jan</li><li>Feb</li><li>Mar</li><li>Apr</li><li>May</li><li>Jun</li>
      <li>Jul</li><li>Aug</li><li>Sep</li><li>Oct</li><li>Nov</li><li>Dec</li>
    </ol>
  </div>
  <div id="sea-window" class="sea-window" hidden>
    <div class="sea-window-card" role="dialog" aria-modal="true" aria-label="Sea visual">
      <p id="sea-window-name" class="sea-window-name"></p>
      <p id="sea-fish" class="sea-fish" hidden></p>
      <button type="button" id="sea-window-close" aria-label="Close">Close</button>
      <div class="dive-skylight" aria-hidden="true"></div>
      <div id="sea-visual" tabindex="0">
        <div class="dive-column">
          <div class="dive-surface">
            <div id="sea-dive-map"></div>
            <div class="dive-surface-veil" aria-hidden="true"></div>
            <div class="dive-caustics" aria-hidden="true"></div>
          </div>
          <div class="dive-water" aria-hidden="true">
            <div class="dive-rays"></div>
            <div class="dive-snow"></div>
            <div class="dive-glow"></div>
            <div id="dive-fish" class="dive-fish"></div>
          </div>
          <ol class="dive-marks"></ol>
        </div>
      </div>
      <p class="dive-hint">Scroll to dive</p>
      <div class="dive-hud" id="sea-depth">
        <span id="sea-depth-meters">Surface</span>
        <span id="sea-depth-zone">Open water</span>
        <span id="sea-depth-source"></span>
      </div>
    </div>
  </div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="turtles.js?v=15"></script>
  <script src="fish.js?v=3"></script>
  <script src="app.js?v=26"></script>
</body>
</html>

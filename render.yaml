# Render Blueprint: deploys Turtle Tide as a public website and redeploys on every
# push to main. See "Put it on the web" in README.md.
services:
  - type: web
    name: turtle-tide
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt -r ui/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
